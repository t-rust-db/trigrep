[package]
name = "trigrep"
version = "0.5.0"
edition = "2021"
description = "Serverless trigram-indexed grep: one SQLite-format cache file per root, no daemon, no SQL"
license = "Apache-2.0"
repository = "https://github.com/t-rust-db/trigrep"

[lib]
name = "trigrep"
path = "src/lib.rs"

[[bin]]
name = "tg"
path = "src/main.rs"

[dependencies]
# Storage only: the cache is a real SQLite file maintained through the
# b-tree/pager layer: db-core with only `storage-row` on — no parser, no VM
# (db-core ADR 0016: db-storage is db_core::storage since v0.78.0).
db-core = { version = "0.78.1", git = "https://github.com/t-rust-db/db-core", tag = "v0.78.1", default-features = false, features = ["storage-row"] }
# The regex engine plus its HIR (required-literal extraction narrows the
# candidate set), and the XDG cache-dir lookup. Ordinary app dependencies:
# this is a binary, not a library (sqlite-rs ADR-0040 does not apply).
regex = "1"
regex-syntax = "0.8"
dirs = "5"

[dev-dependencies]
# Property tests only (#14): never in the shipped binary's closure.
proptest = "1"
db-core = { version = "0.78.1", git = "https://github.com/t-rust-db/db-core", tag = "v0.78.1", default-features = false, features = ["storage-row", "storage-test-support"] }

[profile.release]
lto = true
codegen-units = 1

# Production rule (db-core#230, trigrep#9): production returns typed errors
# and never panics; tests fail fast. clippy.toml's allow-*-in-tests and
# lib.rs's cfg_attr(test, allow(...)) scope these to non-test code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
